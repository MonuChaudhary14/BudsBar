<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudsBar</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="window-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="device-info">
        <div class="device-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
          </svg>
        </div>
        <div class="device-meta">
          <div class="device-name" id="deviceName">realme Buds T310</div>
          <div class="device-status">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Connected</span>
          </div>
        </div>
      </div>
      <button class="icon-button" id="btnRefresh" title="Refresh Status" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </header>

    <!-- Battery Section -->
    <section class="battery-grid">
      <div class="battery-tile" id="cardLeft">
        <div class="tile-top">
          <span class="tile-label">Left</span>
          <span class="tile-pct" id="valLeft">100%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="barLeft" style="width: 100%;"></div>
        </div>
      </div>

      <div class="battery-tile" id="cardRight">
        <div class="tile-top">
          <span class="tile-label">Right</span>
          <span class="tile-pct" id="valRight">100%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="barRight" style="width: 100%;"></div>
        </div>
      </div>

      <div class="battery-tile" id="cardCase">
        <div class="tile-top">
          <span class="tile-label">Case</span>
          <span class="tile-pct" id="valCase">100%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="barCase" style="width: 100%;"></div>
        </div>
      </div>
    </section>

    <!-- Noise Control Section -->
    <section class="control-panel">
      <div class="panel-header">
        <span class="panel-title">Noise Control</span>
      </div>

      <div class="segmented-control" id="ancSegmented">
        <button class="segment-btn" data-mode="cancellation" id="btnAncCancel">
          <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
          <span class="segment-label">Noise Cancellation</span>
        </button>

        <button class="segment-btn" data-mode="off" id="btnAncOff">
          <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
          <span class="segment-label">Normal</span>
        </button>

        <button class="segment-btn" data-mode="transparency" id="btnAncTrans">
          <svg class="segment-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <span class="segment-label">Transparent</span>
        </button>
      </div>

      <div class="mode-caption" id="ancCaption">Normal mode (Noise control off)</div>
    </section>

    <!-- Equalizer Preset Section -->
    <section class="control-panel">
      <div class="panel-header">
        <span class="panel-title">Equalizer Preset</span>
      </div>

      <div class="eq-grid" id="eqGrid">
        <button class="eq-btn active" data-eq="bass_boost">Bass Boost+</button>
        <button class="eq-btn" data-eq="balanced">Balanced</button>
        <button class="eq-btn" data-eq="clear_vocals">Clear Vocals</button>
        <button class="eq-btn" data-eq="bright">Nature Bright</button>
      </div>
    </section>

    <!-- Game Mode Section -->
    <section class="control-panel toggle-row">
      <div class="toggle-text">
        <span class="toggle-title">Game Mode</span>
        <span class="toggle-desc">Low latency audio</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="chkGameMode">
        <span class="slider"></span>
      </label>
    </section>

    <!-- Footer Status (Clean, No Quit Button) -->
    <footer class="app-footer">
      <div class="footer-info">
        <span id="fwInfo">FW 1.1.0.89</span>
        <span class="dot">•</span>
        <span id="rssiInfo">-52 dBm</span>
      </div>
      <div class="footer-hint">⌘Q to quit</div>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
