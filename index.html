<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudsBar</title>
  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="window-shell" id="appShell" data-anc="cancellation">
    <!-- Ambient Reactive Glow Orbs -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <div class="content-container">
      <!-- App Header -->
      <header class="app-header">
        <div class="device-info">
          <div class="device-glyph">
            <!-- Sleek Wireless Earbuds Pair Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
            </svg>
          </div>
          <div class="device-text">
            <div class="device-title-wrap">
              <span class="device-title" id="deviceName">realme Buds T310</span>
              <span class="device-brand-badge">PRO</span>
            </div>
            <div class="device-status">
              <span class="status-pulse-ring">
                <span class="status-indicator" id="statusDot"></span>
              </span>
              <span class="status-label" id="statusText">Connected</span>
              <span class="status-codec">AAC HD</span>
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button class="action-btn" id="btnRefresh" title="Refresh Telemetry (⌘R)" aria-label="Refresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
            </svg>
          </button>
          <button class="action-btn quit-action-btn" id="btnHeaderQuit" title="Quit BudsBar (⌘Q)" aria-label="Quit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Battery Telemetry Grid -->
      <section class="battery-group">
        <!-- Left Bud -->
        <div class="battery-tile" id="cardLeft">
          <div class="tile-top">
            <span class="tile-tag">L</span>
            <div class="tile-bud-icon">
              <!-- Left Earbud Silhouette -->
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M6 2a4 4 0 0 0-4 4c0 1.8 1.2 3.3 2.8 3.8L5 13.5a1.5 1.5 0 0 0 3 0V6a4 4 0 0 0-2-4z"/>
              </svg>
            </div>
            <div class="charging-spark hidden" id="chargeLeft" title="Charging">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
          </div>
          <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 44 44">
              <defs>
                <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00F0FF"/>
                  <stop offset="100%" stop-color="#00A3FF"/>
                </linearGradient>
              </defs>
              <circle class="gauge-track" cx="22" cy="22" r="17.5" pathLength="100"/>
              <circle class="gauge-bar bud-accent" id="ringLeft" cx="22" cy="22" r="17.5" pathLength="100" stroke-dasharray="85, 100"/>
            </svg>
            <div class="gauge-center">
              <span class="gauge-num" id="valLeft">85%</span>
            </div>
          </div>
          <div class="tile-footer">
            <span class="tile-caption">Left Bud</span>
          </div>
        </div>

        <!-- Right Bud -->
        <div class="battery-tile" id="cardRight">
          <div class="tile-top">
            <span class="tile-tag">R</span>
            <div class="tile-bud-icon mirrored">
              <!-- Right Earbud Silhouette -->
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M10 2a4 4 0 0 1 4 4c0 1.8-1.2 3.3-2.8 3.8L11 13.5a1.5 1.5 0 0 1-3 0V6a4 4 0 0 1 2-4z"/>
              </svg>
            </div>
            <div class="charging-spark hidden" id="chargeRight" title="Charging">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
          </div>
          <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 44 44">
              <circle class="gauge-track" cx="22" cy="22" r="17.5" pathLength="100"/>
              <circle class="gauge-bar bud-accent" id="ringRight" cx="22" cy="22" r="17.5" pathLength="100" stroke-dasharray="80, 100"/>
            </svg>
            <div class="gauge-center">
              <span class="gauge-num" id="valRight">80%</span>
            </div>
          </div>
          <div class="tile-footer">
            <span class="tile-caption">Right Bud</span>
          </div>
        </div>

        <!-- Charging Case -->
        <div class="battery-tile case-tile" id="cardCase">
          <div class="tile-top">
            <span class="tile-tag case-tag">CASE</span>
            <div class="tile-bud-icon">
              <!-- Charging Case Silhouette -->
              <svg viewBox="0 0 16 16" fill="currentColor">
                <rect x="2" y="3" width="12" height="10" rx="3.5"/>
                <line x1="2" y1="7" x2="14" y2="7" stroke="rgba(0,0,0,0.5)" stroke-width="0.8"/>
              </svg>
            </div>
            <div class="charging-spark hidden" id="chargeCase" title="Charging">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
              </svg>
            </div>
          </div>
          <div class="gauge-wrap">
            <svg class="gauge-svg" viewBox="0 0 44 44">
              <defs>
                <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#C084FC"/>
                  <stop offset="100%" stop-color="#818CF8"/>
                </linearGradient>
              </defs>
              <circle class="gauge-track" cx="22" cy="22" r="17.5" pathLength="100"/>
              <circle class="gauge-bar case-accent" id="ringCase" cx="22" cy="22" r="17.5" pathLength="100" stroke-dasharray="95, 100"/>
            </svg>
            <div class="gauge-center">
              <span class="gauge-num" id="valCase">95%</span>
            </div>
          </div>
          <div class="tile-footer">
            <span class="tile-caption">Case</span>
          </div>
        </div>
      </section>

      <!-- Noise Control (Active Noise Cancellation) -->
      <section class="control-card anc-card">
        <div class="card-headline">
          <div class="headline-left">
            <span class="headline-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              </svg>
            </span>
            <span class="headline-label">Noise Control</span>
          </div>
          <div class="headline-badges">
            <span class="anc-db-pill" id="ancDbBadge">46 dB</span>
            <span class="shortcut-tag" title="Keyboard Shortcut">⌘⇧N</span>
          </div>
        </div>

        <div class="segmented-track" id="ancSegmented">
          <div class="segmented-thumb" id="ancSlider"></div>
          
          <button class="segmented-option" data-mode="cancellation" id="btnAncCancel">
            <span class="option-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </span>
            <span class="option-label">Noise Cancellation</span>
          </button>

          <button class="segmented-option" data-mode="off" id="btnAncOff">
            <span class="option-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
              </svg>
            </span>
            <span class="option-label">Normal</span>
          </button>

          <button class="segmented-option" data-mode="transparency" id="btnAncTrans">
            <span class="option-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h2M20 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4M12 2v2M12 20v2"/>
                <circle cx="12" cy="12" r="3.5"/>
              </svg>
            </span>
            <span class="option-label">Transparent</span>
          </button>
        </div>

        <div class="anc-info-banner">
          <div class="soundwave-anim" id="soundwaveVisualizer">
            <span class="wave-bar b1"></span>
            <span class="wave-bar b2"></span>
            <span class="wave-bar b3"></span>
            <span class="wave-bar b4"></span>
            <span class="wave-bar b5"></span>
          </div>
          <div class="mode-subtext" id="ancCaption">46 dB Hybrid Active Noise Cancellation</div>
        </div>
      </section>

      <!-- Equalizer Preset Profiles -->
      <section class="control-card eq-card">
        <div class="card-headline">
          <div class="headline-left">
            <span class="headline-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="4" y1="21" x2="4" y2="14"/>
                <line x1="4" y1="10" x2="4" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="12"/>
                <line x1="12" y1="8" x2="12" y2="3"/>
                <line x1="20" y1="21" x2="20" y2="16"/>
                <line x1="20" y1="12" x2="20" y2="3"/>
                <line x1="1" y1="14" x2="7" y2="14"/>
                <line x1="9" y1="8" x2="15" y2="8"/>
                <line x1="17" y1="16" x2="23" y2="16"/>
              </svg>
            </span>
            <span class="headline-label">Equalizer Preset</span>
          </div>
          <span class="eq-status-tag">Dynamic Sound</span>
        </div>

        <div class="eq-matrix" id="eqGrid">
          <!-- Bass Boost+ -->
          <button class="eq-chip active" data-eq="bass_boost">
            <div class="eq-chip-content">
              <div class="eq-chip-header">
                <span class="chip-pip"></span>
                <span class="chip-name">Bass Boost+</span>
              </div>
              <!-- Frequency Curve: Elevated Sub-bass -->
              <svg class="eq-curve" viewBox="0 0 46 16" fill="none">
                <path d="M2 4 C 10 4, 16 12, 26 13 C 34 14, 40 14, 44 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
          </button>

          <!-- Balanced -->
          <button class="eq-chip" data-eq="balanced">
            <div class="eq-chip-content">
              <div class="eq-chip-header">
                <span class="chip-pip"></span>
                <span class="chip-name">Balanced</span>
              </div>
              <!-- Frequency Curve: Studio Flat -->
              <svg class="eq-curve" viewBox="0 0 46 16" fill="none">
                <path d="M2 9 C 14 9, 28 9, 44 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
          </button>

          <!-- Clear Vocals -->
          <button class="eq-chip" data-eq="clear_vocals">
            <div class="eq-chip-content">
              <div class="eq-chip-header">
                <span class="chip-pip"></span>
                <span class="chip-name">Clear Vocals</span>
              </div>
              <!-- Frequency Curve: Elevated Mids (1-3kHz) -->
              <svg class="eq-curve" viewBox="0 0 46 16" fill="none">
                <path d="M2 13 C 12 13, 18 4, 24 4 C 30 4, 36 13, 44 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
          </button>

          <!-- Nature Bright -->
          <button class="eq-chip" data-eq="bright">
            <div class="eq-chip-content">
              <div class="eq-chip-header">
                <span class="chip-pip"></span>
                <span class="chip-name">Nature Bright</span>
              </div>
              <!-- Frequency Curve: Elevated Treble & Air -->
              <svg class="eq-curve" viewBox="0 0 46 16" fill="none">
                <path d="M2 14 C 14 14, 24 11, 32 7 C 38 4, 41 4, 44 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
          </button>
        </div>
      </section>

      <!-- Game Mode (Low Latency) -->
      <section class="control-card game-card">
        <div class="game-meta">
          <div class="game-icon-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="12" x2="10" y2="12"/>
              <line x1="8" y1="10" x2="8" y2="14"/>
              <line x1="15" y1="13" x2="15.01" y2="13"/>
              <line x1="18" y1="11" x2="18.01" y2="11"/>
              <rect x="2" y="6" width="20" height="12" rx="3"/>
            </svg>
          </div>
          <div class="game-copy">
            <div class="game-heading">
              <span>Game Mode</span>
              <span class="latency-badge">
                <span class="latency-dot"></span>
                45ms
              </span>
            </div>
            <div class="game-detail">Ultra-low audio latency sync</div>
          </div>
        </div>

        <label class="switch-control" title="Toggle Game Mode (⌘⇧G)">
          <input type="checkbox" id="chkGameMode">
          <span class="switch-track"></span>
        </label>
      </section>

      <!-- App Diagnostics Footer -->
      <footer class="app-footer">
        <div class="footer-stats">
          <!-- RSSI Signal Bars -->
          <div class="signal-indicator" title="Bluetooth Signal Strength">
            <span class="bar b1 active"></span>
            <span class="bar b2 active"></span>
            <span class="bar b3 active"></span>
            <span class="bar b4"></span>
          </div>
          <span class="stat-text" id="rssiInfo">-58 dBm</span>
          <span class="stat-separator">•</span>
          <span class="stat-badge" id="fwInfo">FW 1.1.0.89</span>
        </div>

        <div class="footer-ctrls">
          <button class="footer-btn danger-btn" id="btnQuit" title="Quit BudsBar (⌘Q)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
              <line x1="12" y1="2" x2="12" y2="12"/>
            </svg>
            <span>Quit</span>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
