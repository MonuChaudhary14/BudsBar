<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudsBar</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="window-shell" id="appShell">
    <!-- Header -->
    <header class="app-header">
      <div class="device-info">
        <div class="device-glyph">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
          </svg>
        </div>
        <div class="device-text">
          <div class="device-title" id="deviceName">realme Buds T310</div>
          <div class="device-status">
            <span class="status-indicator" id="statusDot"></span>
            <span class="status-label" id="statusText">Connected</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="btnRefresh" title="Refresh Status" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
        <button class="action-btn quit-action-btn" id="btnHeaderQuit" title="Quit BudsBar (⌘Q)" aria-label="Quit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Battery Section -->
    <section class="battery-group">
      <div class="battery-tile" id="cardLeft">
        <div class="tile-header">
          <span class="tile-tag">L</span>
          <span class="charging-spark hidden" id="chargeLeft">⚡</span>
        </div>
        <div class="gauge-wrap">
          <svg class="gauge-svg" viewBox="0 0 40 40">
            <circle class="gauge-track" cx="20" cy="20" r="16" pathLength="100" />
            <circle class="gauge-bar" id="ringLeft" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="100, 100" />
          </svg>
          <span class="gauge-num" id="valLeft">100%</span>
        </div>
        <span class="tile-caption">Left Bud</span>
      </div>

      <div class="battery-tile" id="cardRight">
        <div class="tile-header">
          <span class="tile-tag">R</span>
          <span class="charging-spark hidden" id="chargeRight">⚡</span>
        </div>
        <div class="gauge-wrap">
          <svg class="gauge-svg" viewBox="0 0 40 40">
            <circle class="gauge-track" cx="20" cy="20" r="16" pathLength="100" />
            <circle class="gauge-bar" id="ringRight" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="100, 100" />
          </svg>
          <span class="gauge-num" id="valRight">100%</span>
        </div>
        <span class="tile-caption">Right Bud</span>
      </div>

      <div class="battery-tile" id="cardCase">
        <div class="tile-header">
          <span class="tile-tag">CASE</span>
          <span class="charging-spark hidden" id="chargeCase">⚡</span>
        </div>
        <div class="gauge-wrap">
          <svg class="gauge-svg" viewBox="0 0 40 40">
            <circle class="gauge-track" cx="20" cy="20" r="16" pathLength="100" />
            <circle class="gauge-bar case-accent" id="ringCase" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="100, 100" />
          </svg>
          <span class="gauge-num" id="valCase">100%</span>
        </div>
        <span class="tile-caption">Charging Case</span>
      </div>
    </section>

    <!-- Noise Control (ANC) -->
    <section class="control-card">
      <div class="card-headline">
        <span class="headline-label">Noise Control</span>
        <span class="shortcut-tag">⌘⇧N</span>
      </div>

      <div class="segmented-track" id="ancSegmented">
        <div class="segmented-thumb" id="ancSlider"></div>
        <button class="segmented-option active" data-mode="cancellation" id="btnAncCancel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
            <line x1="2" y1="2" x2="22" y2="22"></line>
          </svg>
          <span>Cancel</span>
        </button>

        <button class="segmented-option" data-mode="off" id="btnAncOff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="3" x2="12" y2="7"></line>
          </svg>
          <span>Off</span>
        </button>

        <button class="segmented-option" data-mode="transparency" id="btnAncTrans">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12h2M20 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4M12 2v2M12 20v2"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>Ambient</span>
        </button>
      </div>

      <div class="mode-subtext" id="ancCaption">46 dB Hybrid Active Noise Cancellation</div>
    </section>

    <!-- Equalizer Profiles -->
    <section class="control-card">
      <div class="card-headline">
        <span class="headline-label">Equalizer Preset</span>
      </div>

      <div class="eq-matrix" id="eqGrid">
        <button class="eq-chip active" data-eq="bass_boost">
          <span class="chip-pip"></span>
          <span>Bass Boost+</span>
        </button>
        <button class="eq-chip" data-eq="balanced">
          <span class="chip-pip"></span>
          <span>Balanced</span>
        </button>
        <button class="eq-chip" data-eq="clear_vocals">
          <span class="chip-pip"></span>
          <span>Clear Vocals</span>
        </button>
        <button class="eq-chip" data-eq="bright">
          <span class="chip-pip"></span>
          <span>Nature Bright</span>
        </button>
      </div>
    </section>

    <!-- Game Mode -->
    <section class="control-card game-card">
      <div class="game-meta">
        <div class="game-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="12" x2="10" y2="12"></line>
            <line x1="8" y1="10" x2="8" y2="14"></line>
            <line x1="15" y1="13" x2="15.01" y2="13"></line>
            <line x1="18" y1="11" x2="18.01" y2="11"></line>
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
          </svg>
        </div>
        <div class="game-copy">
          <div class="game-heading">
            <span>Game Mode</span>
            <span class="latency-badge">45ms</span>
          </div>
          <div class="game-detail">Ultra-low audio latency</div>
        </div>
      </div>
      <label class="switch-control">
        <input type="checkbox" id="chkGameMode">
        <span class="switch-track"></span>
      </label>
    </section>

    <!-- Footer Diagnostics -->
    <footer class="app-footer">
      <div class="footer-stats">
        <span id="fwInfo">FW 1.1.0.47</span>
        <span class="stat-separator">•</span>
        <span id="rssiInfo">-52 dBm</span>
      </div>
      <div class="footer-ctrls">
        <button class="footer-btn danger-btn" id="btnQuit" title="Quit BudsBar (⌘Q)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
            <line x1="12" y1="2" x2="12" y2="12"></line>
          </svg>
          <span>Quit BudsBar</span>
        </button>
      </div>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
